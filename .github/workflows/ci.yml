name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official MoonBit SDK
        env:
          MOONBIT_INSTALL_VERSION: 0.10.18+6c83a7f62
        run: |
          curl --fail --location https://cli.moonbitlang.com/install/unix.sh -o /tmp/moonbit-install.sh
          bash /tmp/moonbit-install.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Inspect sources and generated interfaces
        run: |
          moon version --all
          moon update
          moon info
          moon fmt --check
          git diff --exit-code
          python scripts/check_project.py
      - name: Strict target validation and user workflows
        run: |
          moon check --deny-warn --target ${{ matrix.target }}
          moon test --deny-warn --target ${{ matrix.target }}
          moon build --deny-warn --target ${{ matrix.target }}
          moon run examples/quickstart --target ${{ matrix.target }}
          moon run examples/curate --target ${{ matrix.target }}
          moon run examples/edit --target ${{ matrix.target }}
          moon run examples/dataset --target ${{ matrix.target }}
      - name: Independent schema and corpus interoperability
        run: |
          python -m pip install -r scripts/requirements-oracle.txt
          python scripts/verify_interop.py --target ${{ matrix.target }}
          python scripts/verify_compatibility.py --target ${{ matrix.target }}
